name: Import visual refresh 01 — three species

on:
  push:
    branches:
      - feature/paleozoic-1.0.0
    paths:
      - DinoAtlas_VisualRefresh_01_3_images.zip

permissions:
  contents: write

jobs:
  import-three:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/paleozoic-1.0.0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned image verifier
        run: |
          python3 -m venv /tmp/visual-refresh-venv
          /tmp/visual-refresh-venv/bin/pip install --disable-pip-version-check 'Pillow==11.3.0'
      - name: Check exact artwork checksums, back up old bytes, change only three pictures
        run: /tmp/visual-refresh-venv/bin/python tools/import_visual_refresh_01.py
      - name: Verify all 112 animals, source art and app compatibility
        run: |
          npm ci
          npm test
      - name: Verify small-screen filters, favorites and quiz with Chromium
        run: |
          npx playwright install --with-deps chromium --only-shell
          npm run test:ui
      - name: Retire one-use importer workflow
        run: rm .github/workflows/import-visual-refresh-01.yml
      - name: Commit verified image refresh to 1.0 branch (never main)
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Polish three Silurian pictures; save originals; Android build 1000001'
          git push origin HEAD:feature/paleozoic-1.0.0
