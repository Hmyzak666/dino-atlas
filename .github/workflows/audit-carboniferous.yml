name: Carboniferous licensed image audit
# Re-run after checking changed upstream Crassigyrinus bytes.

on:
  push:
    branches:
      - feature/paleozoic-1.0.0
    paths:
      - .github/workflows/audit-carboniferous.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install image verification library
        run: |
          python3 -m venv /tmp/image-audit
          /tmp/image-audit/bin/pip install --disable-pip-version-check "Pillow==11.3.0"
      - name: Download and review strictly identified species images
        run: /tmp/image-audit/bin/python tools/audit_carboniferous_commons.py
      - name: Save source and preview manifest for scientific review
        uses: actions/upload-artifact@v4
        with:
          name: Carboniferous-eight-scientific-image-audit
          path: carboniferous-audit/
          retention-days: 14
