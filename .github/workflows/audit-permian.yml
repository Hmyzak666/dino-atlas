name: Permian eight-image scientific audit

on:
  push:
    branches:
      - feature/paleozoic-1.0.0
    paths:
      - .github/workflows/audit-permian.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review-images:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install Pillow for read-only image inspection
        run: |
          python3 -m venv /tmp/permian-audit
          /tmp/permian-audit/bin/pip install --disable-pip-version-check "Pillow==11.3.0"
      - name: Download eight exact species and check image dimensions and format
        run: /tmp/permian-audit/bin/python tools/audit_permian_commons.py
      - name: Save contact sheet and original source files for review
        uses: actions/upload-artifact@v4
        with:
          name: Permian-eight-scientific-source-audit
          path: permian-audit/
          retention-days: 14
