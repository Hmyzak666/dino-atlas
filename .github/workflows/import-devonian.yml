name: Import eight scientifically checked Devonian animals

on:
  push:
    branches:
      - feature/paleozoic-1.0.0
    paths:
      - Dino-Atlas-1.0.0-Devon-7-pracovnich-obrazku.zip
      - DinoAtlas_Devon_7_images_GitHub.zip
      - .github/workflows/import-devonian.yml

permissions:
  contents: write

jobs:
  import-devonian:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/paleozoic-1.0.0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Adopt previously uploaded Devonian ZIP (no new upload required)
        run: |
          if test -f DinoAtlas_Devon_7_images_GitHub.zip && ! test -f Dino-Atlas-1.0.0-Devon-7-pracovnich-obrazku.zip; then
            mv DinoAtlas_Devon_7_images_GitHub.zip Dino-Atlas-1.0.0-Devon-7-pracovnich-obrazku.zip
          fi
      - name: Download the published CC BY 4.0 scientific Dunkleosteus figure
        run: |
          curl --fail --location --retry 4 --connect-timeout 15 --max-time 90 \
            --user-agent "DinoAtlas educational reader/1.0 (+https://github.com/Hmyzak666/dino-atlas)" \
            --output dunkleosteus-2024-science.jpg \
            "https://upload.wikimedia.org/wikipedia/commons/5/55/Dunkleosteus_terrelli_2024_reconstruction.jpg"
          echo "9bac927d432ba62c5f6b7ffecff4aad161267522  dunkleosteus-2024-science.jpg" | sha1sum --check
      - name: Set up isolated image converter
        run: |
          python3 -m venv /tmp/dino-image-venv
          /tmp/dino-image-venv/bin/pip install --disable-pip-version-check "Pillow==11.3.0"
      - name: Import original WebPs, convert the attributed figure and activate all eight
        run: |
          /tmp/dino-image-venv/bin/python tools/import_devonian.py \
            Dino-Atlas-1.0.0-Devon-7-pracovnich-obrazku.zip \
            dunkleosteus-2024-science.jpg
      - name: Verify all 96 animals and all image credits
        run: |
          npm ci
          npm test
      - name: Test phone layout and quiz in Chromium
        run: |
          npx playwright install --with-deps chromium --only-shell
          npm run test:ui
      - name: Remove the one-time importer workflow
        run: rm .github/workflows/import-devonian.yml
      - name: Commit validated import only into the 1.0 feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Activate Devon: 8 animals, 7 original reconstructions, 1 CC BY scientific figure"
          git push origin HEAD:feature/paleozoic-1.0.0
