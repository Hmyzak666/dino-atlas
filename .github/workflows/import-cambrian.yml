name: Import six reviewed Cambrian pictures

on:
  push:
    branches:
      - feature/paleozoic-1.0.0
    paths:
      - Dino-Atlas-1.0.0-Kambrium-6-obrazku.zip

permissions:
  contents: write

jobs:
  import-cambrian:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/paleozoic-1.0.0
          persist-credentials: true
      - name: Verify six original reconstructions and activate draft entries
        run: python3 tools/import_cambrian.py Dino-Atlas-1.0.0-Kambrium-6-obrazku.zip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Test all 78 images and animal records
        run: |
          npm ci
          npm test
      - name: Commit validated content to the 1.0 feature branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Activate Cambrian batch: 6 animals, 6 independent WebP images (78 total)"
          git push origin HEAD:feature/paleozoic-1.0.0
