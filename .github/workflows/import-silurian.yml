name: Import five reviewed Silurian pictures

on:
  push:
    branches:
      - feature/paleozoic-1.0.0
    paths:
      - Dino-Atlas-1.0.0-Silur-5-obrazku.zip

permissions:
  contents: write

jobs:
  import-silurian:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/paleozoic-1.0.0
          persist-credentials: true
      - name: Validate WebP files and activate five Silurian entries
        run: python3 tools/import_silurian.py Dino-Atlas-1.0.0-Silur-5-obrazku.zip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Verify all 88 records and images
        run: |
          npm ci
          npm test
      - name: Verify mobile quiz and browsing UI
        run: |
          npx playwright install --with-deps chromium --only-shell
          npm run test:ui
      - name: Retire temporary import workflow
        run: rm .github/workflows/import-silurian.yml
      - name: Commit validated changes only to Paleozoic feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Activate five Silurian species and original WebP images (88 total)"
          git push origin HEAD:feature/paleozoic-1.0.0
