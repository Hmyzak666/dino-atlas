name: Activate final eight reviewed Permian animals

on:
  push:
    branches:
      - feature/paleozoic-1.0.0
    paths:
      - .github/workflows/import-permian.yml

permissions:
  contents: write

jobs:
  import-permian:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/paleozoic-1.0.0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install fixed image conversion library
        run: |
          python3 -m venv /tmp/dino-permian
          /tmp/dino-permian/bin/pip install --disable-pip-version-check "Pillow==11.3.0"
      - name: Fetch exact checked source images, write credited WebP and activate all eight
        run: /tmp/dino-permian/bin/python tools/import_permian_commons.py
      - name: Validate all 112 animal records and 112 images
        run: |
          npm ci
          npm test
      - name: Validate mobile atlas and quiz in Chromium
        run: |
          npx playwright install --with-deps chromium --only-shell
          npm run test:ui
      - name: Remove single-use importer after full validation
        run: rm .github/workflows/import-permian.yml
      - name: Commit only into the isolated 1.0.0 feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Activate eight credited Permian species and WebP artwork (112 animals)"
          git push origin HEAD:feature/paleozoic-1.0.0
