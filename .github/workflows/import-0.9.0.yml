name: Import Dino Atlas 0.9.0 package

on:
  push:
    branches:
      - feature/atlas-0.9.0
    paths:
      - Dino-Atlas-0.9.0-pro-GitHub.zip

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/atlas-0.9.0
          persist-credentials: true
      - name: Verify and extract update
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, zipfile
          path = pathlib.Path('Dino-Atlas-0.9.0-pro-GitHub.zip')
          expected = '9a896a8dbde879b46db7fbb5452a73988b8c8697c3c81d1de561b6b23f10ec39'
          actual = hashlib.sha256(path.read_bytes()).hexdigest()
          if actual != expected:
              raise SystemExit('Incorrect ZIP checksum. Refusing to import.')
          with zipfile.ZipFile(path) as z:
              names = z.namelist()
              if len(names) != len(set(names)) or len(names) != 79:
                  raise SystemExit('Unexpected file count/duplicate entry.')
              if len([name for name in names if name.startswith('images/') and name.endswith('.webp')]) != 30:
                  raise SystemExit('Expected exactly 30 new images.')
              for entry in names:
                  p = pathlib.PurePosixPath(entry)
                  if p.is_absolute() or '..' in p.parts or entry.startswith('.git/'):
                      raise SystemExit('Unsafe archive path')
              z.extractall('.')
          config = json.loads(pathlib.Path('project.json').read_text(encoding='utf-8'))
          data = json.loads(pathlib.Path('dinosaurs.json').read_text(encoding='utf-8'))
          if config['version'] != '0.9.0' or config['versionCode'] != 90000 or len(data['dinosaurs']) != 72:
              raise SystemExit('Version or database validation failed.')
          path.unlink()
          pathlib.Path('.github/workflows/import-0.9.0.yml').unlink()
          PY
      - name: Commit source files without changing main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add completed Dino Atlas 0.9.0 candidate from verified transfer package"
          git push origin HEAD:feature/atlas-0.9.0
